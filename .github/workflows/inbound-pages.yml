name: Inbound landing pages

on:
  workflow_call:
    secrets:
      ZEPHYR_AUTH_TOKEN:
        required: true

permissions:
  contents: read

concurrency:
  group: inbound-pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: depot-ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 10.34.9
      - run: pnpm install --frozen-lockfile
      - run: pnpm run test:inbound-pages

  publish:
    needs: validate
    runs-on: depot-ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 10.34.9
      - run: pnpm install --frozen-lockfile
      - name: Build and publish the review application with Rsbuild
        env:
          ZE_SECRET_TOKEN: ${{ secrets.ZEPHYR_AUTH_TOKEN }}
          ZE_FAIL_BUILD: 'true'
          ZE_DEPLOY: 'true'
        run: |
          test -n "$ZE_SECRET_TOKEN" || { echo 'Missing Zephyr deployment credential.' >&2; exit 1; }
          git diff --exit-code
          pnpm run build:inbound-pages
