name: Website and campaign pages

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main, development]

permissions:
  deployments: write # allow creating deployments
  pull-requests: write # allow commenting on PRs
  contents: read # minimal read access to repo, if needed

jobs:
  campaigns:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    uses: ./.github/workflows/inbound-pages.yml
    secrets: inherit

  build:
    needs: campaigns
    runs-on: depot-ubuntu-latest
    env:
      ZE_FAIL_BUILD: 'true'
      PUBLIC_POSTHOG_KEY: ${{ secrets.PUBLIC_POSTHOG_KEY }}
      PUBLIC_POSTHOG_HOST: ${{ secrets.PUBLIC_POSTHOG_HOST }}
      ZE_PUBLIC_ENABLED_LANDERS: ${{ vars.ZE_PUBLIC_ENABLED_LANDERS || '' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.34.9
          run_install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Select the campaign review tag
        if: github.event_name == 'pull_request' || github.ref_name != 'main'
        env:
          CAMPAIGN_BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          campaign_branch_tag="${CAMPAIGN_BRANCH//[^a-zA-Z0-9_-]/-}"
          echo "CAMPAIGN_TAG=web_${campaign_branch_tag}_zackary_chapple" >> "$GITHUB_ENV"

      - name: Typecheck
        if: github.event_name == 'pull_request'
        run: pnpm run typecheck

      - name: Verify generated content is up to date
        if: github.event_name == 'pull_request'
        run: |
          pnpm run generate:rspress-content
          if [ -n "$(git status --porcelain docs/blog docs/changelog src/generated)" ]; then
            echo "::error::Generated content is out of date. Run 'pnpm run generate:rspress-content' and commit the result."
            git status --porcelain docs/blog docs/changelog src/generated
            git --no-pager diff -- docs/blog docs/changelog src/generated
            exit 1
          fi

      - name: Run build for non-merged PR
        if: github.event_name == 'pull_request'
        id: build_non_merge
        env:
          ZE_SECRET_TOKEN: ${{ secrets.ZEPHYR_AUTH_TOKEN }}
        run: |
          if [ -z "$ZE_SECRET_TOKEN" ]; then
            echo "::error::ZE_SECRET_TOKEN is missing. The Zephyr build requires this token; without it the deploy falls back to an interactive login prompt and hangs. (Note: secrets are not available on PRs from forks.)"
            exit 1
          fi
          pnpm run build

      - name: Publish main or development
        if: github.event_name == 'push'
        id: build_merge
        env:
          ZE_SECRET_TOKEN: ${{ secrets.ZEPHYR_AUTH_TOKEN }}
        run: pnpm run build

      - name: Zephyr deploy summary
        uses: ZephyrCloudIO/zephyr-preview-environment-action@30036a8a1c2031c4f6c6706d2cbc1a9b48466ae2 # main
        id: zephyr-summary
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
