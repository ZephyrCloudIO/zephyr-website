name: Run on PRs

on:
  pull_request:
    types: [opened, closed, synchronize]

permissions:
  deployments: write # allow creating deployments
  pull-requests: write # allow commenting on PRs
  contents: read # minimal read access to repo, if needed

jobs:
  build:
    runs-on: depot-ubuntu-latest
    env:
      PUBLIC_POSTHOG_KEY: ${{ secrets.PUBLIC_POSTHOG_KEY }}
      PUBLIC_POSTHOG_HOST: ${{ secrets.PUBLIC_POSTHOG_HOST }}
      ZE_PUBLIC_ENABLED_LANDERS: ${{ vars.ZE_PUBLIC_ENABLED_LANDERS || '' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6
        with:
          node-version: '24'

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.32.1
          run_install: false

      - name: Install dependencies
        run: pnpm i

      - name: Typecheck
        if: github.event.action != 'closed'
        run: pnpm run typecheck

      - name: Verify generated content is up to date
        if: github.event.action != 'closed'
        run: |
          pnpm run generate:rspress-content
          if [ -n "$(git status --porcelain docs/blog docs/changelog src/generated)" ]; then
            echo "::error::Generated content is out of date. Run 'pnpm run generate:rspress-content' and commit the result."
            git status --porcelain docs/blog docs/changelog src/generated
            git --no-pager diff -- docs/blog docs/changelog src/generated
            exit 1
          fi

      - name: Run build for non-merged PR
        if: github.event.action != 'closed' && github.event.pull_request.merged != true
        id: build_non_merge
        env:
          ZE_SECRET_TOKEN: ${{ secrets.ZEPHYR_AUTH_TOKEN }}
        run: |
          if [ -z "$ZE_SECRET_TOKEN" ]; then
            echo "::error::ZE_SECRET_TOKEN is missing. The Zephyr build requires this token; without it the deploy falls back to an interactive login prompt and hangs. (Note: secrets are not available on PRs from forks.)"
            exit 1
          fi
          pnpm run build

      - name: Run build for merged PR on main or development
        if: github.event.pull_request.merged == true &&
          github.event.action == 'closed' &&
          (github.event.pull_request.base.ref == 'main' || github.event.pull_request.base.ref == 'development')
        id: build_merge
        env:
          ZE_SECRET_TOKEN: ${{ secrets.ZEPHYR_AUTH_TOKEN }}
        run: pnpm run build

      - name: Zephyr deploy summary
        uses: ZephyrCloudIO/zephyr-preview-environment-action@30036a8a1c2031c4f6c6706d2cbc1a9b48466ae2 # main
        id: zephyr-summary
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
