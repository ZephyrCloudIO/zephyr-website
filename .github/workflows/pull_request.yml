name: Validate EmDash site

on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: read

jobs:
  build:
    runs-on: depot-ubuntu-latest
    env:
      PUBLIC_POSTHOG_KEY: ${{ secrets.PUBLIC_POSTHOG_KEY }}
      PUBLIC_POSTHOG_HOST: ${{ secrets.PUBLIC_POSTHOG_HOST }}
      ZE_PUBLIC_ENABLED_LANDERS: ${{ vars.ZE_PUBLIC_ENABLED_LANDERS || '' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.34.5
          run_install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepare and validate migrated content
        run: |
          pnpm emdash:prepare
          pnpm emdash:validate
          pnpm emdash:verify
          pnpm emdash:verify --clean-checkout

      - name: Typecheck
        run: pnpm run typecheck

      - name: Verify migration snapshot is up to date
        run: |
          if [ -n "$(git status --porcelain .emdash/seed.json .emdash/migration-manifest.json)" ]; then
            echo "::error::Migration snapshot is out of date. Run 'pnpm emdash:prepare' and commit the result."
            git status --porcelain .emdash/seed.json .emdash/migration-manifest.json
            git --no-pager diff -- .emdash/seed.json .emdash/migration-manifest.json
            exit 1
          fi

      - name: Build Worker and assets without deploying
        run: pnpm run build

      - name: Validate Worker deployment bundle
        run: pnpm deploy:dry
